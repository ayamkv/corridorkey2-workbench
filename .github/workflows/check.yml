name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Engine, application and offscreen UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Package committed source without models
        shell: powershell
        run: ./packaging/make_dist.ps1 -Release -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: CorridorKey2-Workbench-Windows
          path: dist/*.zip*
